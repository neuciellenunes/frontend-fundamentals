<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!--img -> tag de imagem, usada para exibir imagens em uma página web.
    src -> atributo que especifica o caminho da imagem a ser exibida.
    alt -> atributo que especifica o texto alternativo para a imagem.
    width -> atributo que especifica a largura da imagem.
    height -> atributo que especifica a altura da imagem.
    -->


    <img src="free-tour-oslo.jpeg" alt="imagem da cidade de Oslo - Noruega" width="500" height="333"> 
</body>
</html>
