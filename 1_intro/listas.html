<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <!-- listas nao ordenadas -->
    <ul>
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
    </ul>

    <!-- listas ordenadas -->
    <ol>
        <li>Primeiro</li>
        <li>Segundo</li>
        <li>Terceiro</li>
    </ol>

    <!-- listas de definição -->
     <!-- dl -> tag de lista de definição, usada para criar listas de termos e definições.-->
      <!-- dt -> tag de termo de definição, usada para definir o termo em uma lista de definição. -->
       <!-- dd -> tag de definição, usada para fornecer a definição do termo em uma lista de definição. -->
    <dl>
        <dt>Termo 1</dt>
        <dd>Definição 1</dd>
        <dt>Termo 2</dt>
        <dd>Definição 2</dd>
    </dl>

</body>
</html>
